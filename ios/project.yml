name: GpuiExample
options:
  bundleIdPrefix: dev.gpui
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 9BSAS444YP
    CODE_SIGN_STYLE: Automatic

targets:
  GpuiExample:
    type: application
    platform: iOS
    sources:
      - path: main.m
        type: file
        buildPhase: sources
      - path: gpui_ios.h
        type: file
        buildPhase: headers
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        # Using a fresh ID to bypass previous 'No profiles found' errors
        PRODUCT_BUNDLE_IDENTIFIER: dev.fanni.gpui.mobile.test1
        PRODUCT_NAME: GpuiExample
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9BSAS444YP
        SWIFT_VERSION: "5.0"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LINK_BINARY_WITH_LIBRARIES_SECTION_TYPE: static
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(EXAMPLE_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AudioToolbox"
          - "-framework WebKit"
          - "-framework CoreMedia"
          - "-framework AVFoundation"
          - "-framework LocalAuthentication"
          - "-framework Contacts"
          - "-framework EventKit"
          - "-framework StoreKit"
          - "-framework CoreMotion"
          - "-ObjC"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "USE_GPUI_RUST=1"
          - "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
        "RUST_TARGET[sdk=iphonesimulator*]": aarch64-apple-ios-sim
        "RUST_TARGET[sdk=iphoneos*]": aarch64-apple-ios
        EXAMPLE_STATIC_LIB: "$(PROJECT_DIR)/../target/$(RUST_TARGET)/release/libgpui_mobile_example.a"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          GCC_OPTIMIZATION_LEVEL: "s"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    preBuildScripts:
      - name: "Build Rust Static Library"
        script: |
          set -euo pipefail

          # Load Rust environment so Xcode finds 'cargo'
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          else
            export PATH="$HOME/.cargo/bin:$PATH"
          fi

          RUST_PROJECT_DIR="${PROJECT_DIR}/.."
          cd "${RUST_PROJECT_DIR}"

          # Determine the Rust target triple based on Xcode SDK
          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            RUST_TARGET="aarch64-apple-ios-sim"
          else
            RUST_TARGET="aarch64-apple-ios"
          fi

          # FORCED: Always use release for performance during dictionary imports
          CARGO_FLAGS="--release"

          echo "Building gpui-mobile for ${RUST_TARGET} (FORCED RELEASE)..."

          # Ensure the Rust target is installed
          rustup target add "${RUST_TARGET}" 2>/dev/null || true

          # Build the Rust static library
          cargo build --target "${RUST_TARGET}" ${CARGO_FLAGS} 2>&1

          echo "Rust build complete for ${RUST_TARGET}"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
